name: Generate Exact Series

on:
  push:
    branches: [ main ]
    paths:
      - 'src/u2bps/**'
      - 'scripts/01_generate_exact_series.py'
      - 'pyproject.toml'
      - '.github/workflows/generate-exact-series.yml'
  workflow_dispatch:
    inputs:
      qmax:
        description: 'Maximum q-power exponent j'
        required: false
        default: '50'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate exact coefficients
        run: |
          python scripts/01_generate_exact_series.py \
            --qmax ${{ github.event.inputs.qmax || '50' }} \
            --progress

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add results/generated/exact/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update exact series coefficients (qmax=${{ github.event.inputs.qmax || '50' }})"
            git push
          )

      - name: Create summary
        run: |
          echo "## Exact Series Generation Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Python: 3.10" >> $GITHUB_STEP_SUMMARY
          echo "- q-power exponent: ${{ github.event.inputs.qmax || '50' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "results/generated/exact" ]; then
            echo "**Generated files:**" >> $GITHUB_STEP_SUMMARY
            ls -1 results/generated/exact/ >> $GITHUB_STEP_SUMMARY
          fi
